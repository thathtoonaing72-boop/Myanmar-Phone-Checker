
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Myanmar Phone Checker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .login {
      width: 100%;
      max-width: 380px;
      padding: 28px;
      background: #1e293b;
      border-radius: 14px;
    }
    h2 { text-align: center; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
    }
    button {
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    #message {
      text-align: center;
      color: #fca5a5;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="login">
    <h2>MYANMAR PHONE CHECKER</h2>
    <p style="text-align:center">ADMIN LOGIN</p>

    <form id="loginForm">
      <input
        type="password"
        id="password"
        placeholder="Admin Password"
        required
      >
      <button type="submit">LOGIN</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Checking...";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: document.getElementById("password").value
          })
        });

        const result = await response.json();

        if (response.ok && result.ok) {
          window.location.href = "/admin-dashboard.html";
        } else {
          message.textContent = "Login failed. Check your password.";
        }
      } catch {
        message.textContent = "Server connection failed.";
      }
    });
  </script>
</body>
</html>
